name: App mobile tests

# The root manifest and lockfile are in scope on purpose. The workspace catalog
# pins the React version every platform compiles against, so a one-line change
# there can break the native app while `packages/app/**` is untouched -- which is
# exactly how a React/renderer version mismatch reached main once already. A
# dependency change that no mobile job even runs against is not reviewable.
on:
  pull_request:
    paths:
      - "packages/app/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/app-mobile-test.yml"
  push:
    branches: [main]
    paths:
      - "packages/app/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/app-mobile-test.yml"
  workflow_dispatch:

concurrency:
  group: app-mobile-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-js:
    name: App JS/TS tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Typecheck + unit/component tests
        run: |
          bun run typecheck
          bun test

  android-unit:
    name: Android unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: packages/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: android-actions/setup-android@v3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: JVM unit tests
        run: bun run test:android:unit
      - name: Prove package-identity test can fail
        # Invert the assertion temporarily via a one-shot gradle property is hard;
        # instead run a tiny companion check that the test class is on the classpath
        # and that APPLICATION_ID is the store id (identity/product.json's
        # android_package_id), failing this step if not.
        run: |
          cd android
          ./gradlew :app:compileDebugUnitTestJavaWithJavac :app:compileDebugUnitTestKotlin --console=plain
          # Extract APPLICATION_ID from generated BuildConfig
          bc=$(find app/build -name BuildConfig.java -o -name BuildConfig.kt | head -1)
          echo "BuildConfig=$bc"
          grep -E 'ai\.ompctl\.app' "$bc"

  android-instrumentation:
    name: Android emulator instrumentation
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: packages/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: android-actions/setup-android@v3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumentation smoke on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          working-directory: packages/app
          script: bash ./scripts/android-instrumentation-test.sh

  android-apks:
    name: Android APKs for real devices
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: packages/app
    # PATH.md's gate runs the round trip on a real phone, and Detox drives
    # Android through Espresso, which needs the instrumentation package
    # alongside the app. No release install carries one, and a workstation
    # without an Android SDK cannot build one, so the only way `check:path`
    # reaches its device half is for CI to publish both APKs.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: android-actions/setup-android@v3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Assemble app and instrumentation APKs
        run: |
          cd android
          ./gradlew :app:assembleDebug :app:assembleAndroidTest -DtestBuildType=debug --console=plain
      - name: Report what was built
        # The gate asserts the installed version off the device, so the build
        # that produced these has to be identifiable from the artifact alone.
        run: |
          cd android
          ls -l app/build/outputs/apk/debug/app-debug.apk
          ls -l app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          # PATH launches without Metro, so the published app must contain the
          # bundle rather than only carrying native debug code.
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk assets/index.android.bundle
          echo "commit=${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          if-no-files-found: error
          retention-days: 14
          path: |
            packages/app/android/app/build/outputs/apk/debug/app-debug.apk
            packages/app/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

  ios-sim:
    name: iOS simulator UI smoke (${{ matrix.family }})
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        family: [iPhone, iPad]
    defaults:
      run:
        working-directory: packages/app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Select Xcode 16+
        run: |
          # RN 0.81 requires Xcode >= 16.1. Prefer an install that ships an iOS Simulator runtime.
          for app in             /Applications/Xcode_16.4.app             /Applications/Xcode_16.3.app             /Applications/Xcode_16.2.app             /Applications/Xcode_16.1.app             /Applications/Xcode_16.app             /Applications/Xcode.app; do
            if [[ -d "$app/Contents/Developer" ]]; then
              sudo xcode-select -s "$app/Contents/Developer"
              if xcrun simctl list runtimes 2>/dev/null | grep -q 'iOS'; then
                echo "selected $app with iOS runtime"
                break
              fi
            fi
          done
          xcodebuild -version
          xcrun simctl list runtimes || true
      - name: CocoaPods
        run: |
          cd ios
          pod install
      - name: Simulator smoke (LaunchSmokeUITests only)
        run: bun run test:ios:sim -- ${{ matrix.family }}
