# Deploys the ompctl marketing site (ompctl.ai) to GitHub Pages.
#
# Tradeoff against the retired Cloud Run origin:
# its static server set explicit Cache-Control headers:
#   - public, max-age=86400 for screenshots in shots/
#   - public, max-age=300 for index.html and styles.css
# GitHub Pages serves static assets through its own CDN edge with managed cache headers
# (typically 10 minutes / 600s TTL) and does not permit custom Cache-Control headers.
# Custom cache-control headers are lost with this move.
#
# Build gate invariant:
# The site is built via `bun run build` in packages/site, producing packages/site/dist.
# The build script verifies every referenced asset exists, every screenshot is
# used, every anchor resolves, CNAME exists, and no app association files are
# included. The job publishes packages/site/dist, never public/.
name: site-pages

on:
  push:
    branches: [main]
    paths:
      - "packages/site/**"
      - ".github/workflows/site-pages.yml"
  pull_request:
    paths:
      - "packages/site/**"
      - ".github/workflows/site-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build marketing site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Build site and verify assets
        run: bun run --cwd packages/site build
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/site/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
