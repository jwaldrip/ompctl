name: site-pages

# Verifies marketing site assets build cleanly.
# Automatic Pages publication and upload capabilities are removed during infrastructure retirement.

on:
  pull_request:
    paths:
      - "packages/site/**"
      - ".github/workflows/site-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build marketing site verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Build site and verify assets
        run: bun run --cwd packages/site build
