# Builds and deploys the ompd hub. NOT RUN: this workflow has never executed
# and nothing described here exists in any GCP project yet.
#
# Manual dispatch only. The hub brokers access to machines that execute code,
# so it does not deploy itself on a push to a branch.
name: hub-deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # The redis-backed backplane is the part that only works or fails for
      # real against a real Redis, so the deploy path runs it against one
      # rather than against the memory implementation.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Test the tunnel and the hub
        env:
          OMPD_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: bun test packages/tunnel packages/hub

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push hub + web + site images
        # `gcloud builds submit --tag ... --file ...` does not exist: `--tag`
        # mode hardcodes `docker build -t TAG .` against `./Dockerfile` in the
        # source root, with no flag to point it at a different Dockerfile
        # path. Both images live outside the repo root, so each has its own
        # committed Cloud Build config (packages/*/deploy/cloudbuild.yaml)
        # rather than one generated inline, which a `run: |` block's own YAML
        # indentation makes impossible to terminate correctly.
        #
        # `--async` + poll, not the default synchronous log-streaming submit:
        # streaming requires the caller to be project Viewer/Owner (a
        # primitive role Cloud Build checks specifically, not satisfied by
        # any granular role such as logging.viewer), which the deployer SA
        # deliberately does not hold. The build itself does not need it.
        run: |
          REG="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ompd"
          CONSOLE="https://console.cloud.google.com/cloud-build/builds"

          # Submitting a build and learning its outcome are two different
          # operations, and this function keeps their failures apart on purpose.
          #
          # Run 32383715488 conflated them and lost the deploy to it. The poll
          # read the status straight into an assignment, `status="$(gcloud builds
          # describe ...)"`. One describe of the still-running site build
          # answered FAILED_PRECONDITION, and because this step runs under
          # `bash -e` a failed command substitution in an assignment aborts the
          # whole script. Nothing was wrong with that build: the same id had
          # already polled clean four times over the preceding 54s, the same call
          # had just succeeded for hub and web, and the site image had built and
          # pushed from byte-identical source in two earlier runs. The deploy died
          # of a failed question, not a failed build, and it died mute: the abort
          # happened inside the assignment, so the function never reached a line
          # that could name the build, and terraform never ran at all.
          #
          # Hence the split below. A query that fails is retried and is not
          # allowed to imply anything about the build. A build is failed only when
          # Cloud Build actually reports it terminal and not SUCCESS. And every
          # exit path prints the build id and its console URL, because the one
          # thing the old loop never told anyone was where to go and look.
          submit_and_wait() {
            local config="$1" tag="$2"
            local id status err attempt unreadable=0

            # Guarded rather than a bare assignment for the same `bash -e` reason,
            # and because gcloud's own error does not say which of the three
            # configs was in flight when it fired.
            if ! id="$(gcloud builds submit \
              --project "${{ vars.GCP_PROJECT_ID }}" \
              --config "$config" \
              --substitutions "_IMAGE_TAG=${tag}" \
              --async \
              --format='value(id)' \
              .)"; then
              echo "::error::submitting $config for $tag failed"
              return 1
            fi
            # An empty id would send every describe below to look up nothing, and
            # `value(status)` of nothing reads exactly like a build too young to
            # have a status yet: the poll would spin the full window and then
            # blame a build that was never created.
            if [ -z "$id" ]; then
              echo "::error::submitting $config for $tag returned no build id"
              return 1
            fi
            echo "submitted build $id for $tag"

            err="$(mktemp)"
            for attempt in $(seq 1 60); do
              # The describe sits in an `if` condition, which is the one place
              # `bash -e` tolerates a non-zero exit, and its stderr goes to a file
              # so the actual reason survives long enough to be printed.
              if status="$(gcloud builds describe "$id" \
                --project "${{ vars.GCP_PROJECT_ID }}" \
                --format='value(status)' 2>"$err")"; then
                unreadable=0
                case "$status" in
                  SUCCESS) echo "build $id succeeded"; rm -f "$err"; return 0 ;;
                  WORKING|QUEUED|PENDING) sleep 10 ;;
                  *)
                    # Cloud Build's own verdict, so this one is terminal. Ask again
                    # for the fields that say which step died: statusDetail and
                    # failureInfo are what a human needs and what the old loop
                    # dropped on the floor.
                    echo "::error::build $id for $tag ended in status ${status:-<none>}"
                    gcloud builds describe "$id" --project "${{ vars.GCP_PROJECT_ID }}" \
                      --format='value(statusDetail,failureInfo.type,failureInfo.detail)' || true
                    echo "logs: $CONSOLE/$id?project=${{ vars.GCP_PROJECT_ID }}"
                    rm -f "$err"
                    return 1
                    ;;
                esac
              else
                # The question failed, which says nothing about the answer.
                # Whatever precondition Cloud Build objected to was not a stable
                # property of this build, because describe had already answered
                # for this same id, so the right move is to ask again rather than
                # to report a red build nobody has evidence for. Bounded: a
                # backend that will not answer at all still has to end the step.
                unreadable=$((unreadable + 1))
                echo "cannot read build $id (attempt $attempt, $unreadable consecutive): $(tr '\n' ' ' < "$err")"
                if [ "$unreadable" -ge 6 ]; then
                  echo "::error::Cloud Build would not report on $id for $tag after $unreadable consecutive failed queries"
                  echo "the build itself may well have succeeded; check $CONSOLE/$id?project=${{ vars.GCP_PROJECT_ID }}"
                  rm -f "$err"
                  return 1
                fi
                sleep 10
              fi
            done
            echo "::error::build $id for $tag did not finish within the poll window"
            echo "logs: $CONSOLE/$id?project=${{ vars.GCP_PROJECT_ID }}"
            rm -f "$err"
            return 1
          }

          submit_and_wait packages/hub/deploy/cloudbuild.yaml "${REG}/hub:${{ github.sha }}"
          submit_and_wait packages/web/deploy/cloudbuild.yaml "${REG}/web:${{ github.sha }}"
          submit_and_wait packages/site/deploy/cloudbuild.yaml "${REG}/site:${{ github.sha }}"

      - uses: hashicorp/setup-terraform@v3

      - name: Grant Cloud DNS admin
        run: |
          # Enabling the API is a one-time owner action. The deployer cannot
          # do it. Grant the role the zone apply needs; fail if that grant fails.
          if ! gcloud services enable dns.googleapis.com --project "${{ vars.GCP_PROJECT_ID }}"; then
            echo "dns.googleapis.com is not enabled and this SA cannot enable it."
            echo "Enable it once as the project owner, then re-run."
          fi
          gcloud projects add-iam-policy-binding "${{ vars.GCP_PROJECT_ID }}" \
            --member "serviceAccount:${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}" \
            --role roles/dns.admin --quiet


      - name: Apply
        working-directory: packages/hub/deploy
        run: |
          terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform apply -auto-approve \
            -var "project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var "region=${{ vars.GCP_REGION }}" \
            -var "network_id=${{ vars.GCP_NETWORK_ID }}" \
            -var "connector_id=${{ vars.GCP_VPC_CONNECTOR_ID }}" \
            -var "image=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ompd/hub:${{ github.sha }}" \
            -var "web_image=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ompd/web:${{ github.sha }}" \
            -var "site_image=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ompd/site:${{ github.sha }}" \
            -var "app_domain=${{ vars.OMPCTL_APP_DOMAIN || 'app.ompctl.ai' }}" \
            -var "hub_domain=${{ vars.OMPCTL_HUB_DOMAIN || 'hub.ompctl.ai' }}" \
            -var "apple_team_id=${{ vars.OMPCTL_APPLE_TEAM_ID }}" \
            -var "play_cert_sha256=${{ vars.OMPCTL_PLAY_CERT_SHA256 }}"
          echo "::group::Cloud DNS nameservers (set these at Squarespace, nothing else)"
          terraform output -json nameservers
          terraform output -json product_identity
          echo "::endgroup::"
