name: hub-deploy

# DEPLOYMENT PERMANENTLY DISABLED
# Automatic push triggers and active deployment jobs are removed.
# The hosted ompctl infrastructure is retired.

on:
  workflow_dispatch:

jobs:
  refusal:
    name: Refuse retired deployment
    runs-on: ubuntu-latest
    steps:
      - name: Refuse deployment during retirement
        run: |
          echo "::error::hub-deploy is retired. Deployment to ompctl infrastructure is permanently disabled."
          echo "::error::See .github/workflows/retire-infra.yml and docs/ops/RETIREMENT_RUNBOOK.md."
          exit 1
