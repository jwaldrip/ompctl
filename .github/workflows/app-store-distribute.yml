name: App store release tracks

# Every merge to main archives and uploads iOS and macOS to TestFlight. Manual
# dispatch remains for Android, Windows, or an artifact-only Apple build.
# Missing release credentials fail the job; a merge must never report success
# while publishing nothing.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma list: ios,android,macos,windows,all"
        required: true
        default: "ios,macos"
      upload:
        description: "Upload to stores when secrets exist"
        type: boolean
        default: true
  push:
    branches: [main]


jobs:
  release-order:
    name: Preserve main release order
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for earlier main releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "non-main release; ordering gate not needed"
            exit 0
          fi
          endpoint="/repos/$GITHUB_REPOSITORY/actions/workflows/app-store-distribute.yml/runs?branch=main&per_page=100"
          while true; do
            if ! earlier="$(gh api --paginate "$endpoint" --jq ".workflow_runs[] | select(.id < $GITHUB_RUN_ID and .status != \"completed\") | .id")"; then
              echo "::error::Could not read earlier release runs"
              exit 1
            fi
            if [[ -z "$earlier" ]]; then
              break
            fi
            echo "waiting for earlier release runs: $earlier"
            sleep 15
          done
          echo "earlier main releases complete"

  ios-testflight:
    name: iOS archive + TestFlight
    needs: release-order
    if: >
      github.event_name == 'push' ||
      contains(github.event.inputs.platforms, 'ios') ||
      github.event.inputs.platforms == 'all'
    runs-on: macos-15
    timeout-minutes: 180
    defaults:
      run:
        working-directory: packages/app
    env:
      OMPD_APPLE_TEAM_ID: ${{ secrets.OMPD_APPLE_TEAM_ID }}
      OMPD_ASC_KEY_ID: ${{ secrets.OMPD_ASC_KEY_ID }}
      OMPD_ASC_ISSUER_ID: ${{ secrets.OMPD_ASC_ISSUER_ID }}
      OMPD_ASC_PRIVATE_KEY: ${{ secrets.OMPD_ASC_PRIVATE_KEY }}
      OMPD_APPLE_CERT_P12_BASE64: ${{ secrets.OMPD_APPLE_CERT_P12_BASE64 }}
      OMPD_APPLE_CERT_P12_PASSWORD: ${{ secrets.OMPD_APPLE_CERT_P12_PASSWORD }}
      OMPD_IOS_PROFILE_BASE64: ${{ secrets.OMPD_IOS_PROFILE_BASE64 }}
      OMPD_APP_ID: ${{ vars.OMPD_ASC_APP_ID }}
      OMPD_BETA_GROUP_ID: ${{ vars.OMPD_ASC_BETA_GROUP_ID }}
      OMPD_UPLOAD: ${{ github.event_name == 'push' && 'true' || github.event.inputs.upload }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve build number
        run: |
          source ./scripts/lib/version.sh
          ompd_version__resolve
          {
            echo "OMPD_BUILD_NUMBER=$OMPD_BUILD_NUMBER"
            echo "OMPD_VERSION_CODE=$OMPD_BUILD_NUMBER"
            echo "OMPD_VERSION_NAME=$OMPD_VERSION_NAME"
            echo "OMPD_WINDOWS_VERSION=$OMPD_WINDOWS_VERSION"
          } >> "$GITHUB_ENV"
          echo "Resolved build number: $OMPD_BUILD_NUMBER (version $OMPD_VERSION_NAME)"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Require Apple team id for archive
        if: env.OMPD_APPLE_TEAM_ID == ''
        run: |
          echo "::error::OMPD_APPLE_TEAM_ID secret is required to archive for TestFlight"
          exit 1
      - name: Require distribution certificate
        if: env.OMPD_APPLE_CERT_P12_BASE64 == '' || env.OMPD_APPLE_CERT_P12_PASSWORD == ''
        run: |
          echo "::error::OMPD_APPLE_CERT_P12_BASE64 and OMPD_APPLE_CERT_P12_PASSWORD are required for signed archives on GitHub runners"
          exit 1
      - name: Require iOS provisioning profile
        if: env.OMPD_IOS_PROFILE_BASE64 == ''
        run: |
          echo "::error::OMPD_IOS_PROFILE_BASE64 is required"
          exit 1
      - name: Import Apple signing certificate
        run: bash ./scripts/import-apple-signing.sh
      - name: Select release Xcode
        env:
          OMPD_REQUIRE_IOS_SDK: "1"
        run: bash ./scripts/select-release-xcode.sh
      - name: Install pods
        run: |
          cd ios
          pod install
      - name: Import ASC API key
        if: env.OMPD_ASC_KEY_ID != '' && env.OMPD_ASC_ISSUER_ID != '' && env.OMPD_ASC_PRIVATE_KEY != ''
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          key_id = os.environ["OMPD_ASC_KEY_ID"]
          material = os.environ["OMPD_ASC_PRIVATE_KEY"]
          if "\\n" in material and "\n" not in material:
              material = material.replace("\\n", "\n")
          p = Path.home() / ".appstoreconnect/private_keys" / f"AuthKey_{key_id}.p8"
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(material)
          p.chmod(0o600)
          print(f"asc_key_bytes {p.stat().st_size}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"OMPD_ASC_KEY_PATH={p}\n")
          PY
      - name: Import iOS provisioning profile
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          profile = Path(os.environ["RUNNER_TEMP"]) / "ompctl-ios.mobileprovision"
          profile.write_bytes(base64.b64decode("".join(os.environ["OMPD_IOS_PROFILE_BASE64"].split())))
          profile.chmod(0o600)
          print(f"ios_profile_bytes {profile.stat().st_size}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"OMPD_IOS_PROFILE_PATH={profile}\n")
          PY
      - name: Archive IPA
        run: bun run build:ios:archive
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ompd-ios-ipa
          path: packages/app/build/ios/ipa/*.ipa
          if-no-files-found: error
      - name: Require ASC release configuration
        if: >
          env.OMPD_UPLOAD == 'true' && (
            env.OMPD_ASC_KEY_PATH == '' ||
            env.OMPD_APP_ID == '' ||
            env.OMPD_BETA_GROUP_ID == ''
          )
        run: |
          echo "::error::App Store Connect key, app id, and beta group id are required"
          exit 1
      - name: Check for an existing iOS upload
        id: ios_build
        if: env.OMPD_UPLOAD == 'true' && env.OMPD_ASC_KEY_PATH != ''
        run: |
          if bun scripts/asc.ts find-build "$OMPD_BUILD_NUMBER" IOS; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" -ne 3 ]]; then
              exit "$status"
            fi
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload to TestFlight
        if: env.OMPD_UPLOAD == 'true' && env.OMPD_ASC_KEY_PATH != '' && steps.ios_build.outputs.exists != 'true'
        run: bun run upload:testflight
      - name: Publish iOS build to internal testers
        if: env.OMPD_UPLOAD == 'true' && env.OMPD_ASC_KEY_PATH != ''
        run: bun scripts/asc.ts wait-assign "$OMPD_BUILD_NUMBER" IOS
      - name: Artifact-only notice
        if: env.OMPD_UPLOAD != 'true'
        run: echo "upload=false; IPA artifact retained (no TestFlight submit)"

  android-play-internal:
    name: Android AAB + Play Internal
    if: >
      github.event_name == 'workflow_dispatch' && (
        contains(github.event.inputs.platforms, 'android') ||
        github.event.inputs.platforms == 'all'
      )
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/app
    env:
      OMPD_ANDROID_KEYSTORE_BASE64: ${{ secrets.OMPD_ANDROID_KEYSTORE_BASE64 }}
      OMPD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.OMPD_ANDROID_KEYSTORE_PASSWORD }}
      OMPD_ANDROID_KEY_ALIAS: ${{ secrets.OMPD_ANDROID_KEY_ALIAS }}
      OMPD_ANDROID_KEY_PASSWORD: ${{ secrets.OMPD_ANDROID_KEY_PASSWORD }}
      OMPD_PLAY_SERVICE_ACCOUNT_JSON_VALUE: ${{ secrets.OMPD_PLAY_SERVICE_ACCOUNT_JSON }}
      OMPD_UPLOAD: ${{ github.event_name == 'push' && 'true' || github.event.inputs.upload }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve build number
        run: |
          source ./scripts/lib/version.sh
          ompd_version__resolve
          {
            echo "OMPD_BUILD_NUMBER=$OMPD_BUILD_NUMBER"
            echo "OMPD_VERSION_CODE=$OMPD_BUILD_NUMBER"
            echo "OMPD_VERSION_NAME=$OMPD_VERSION_NAME"
            echo "OMPD_WINDOWS_VERSION=$OMPD_WINDOWS_VERSION"
          } >> "$GITHUB_ENV"
          echo "Resolved build number: $OMPD_BUILD_NUMBER (version $OMPD_VERSION_NAME)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: android-actions/setup-android@v3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Decode upload keystore
        run: |
          if [[ -z "${OMPD_ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "::error::OMPD_ANDROID_KEYSTORE_BASE64 secret is required for release AAB"
            exit 1
          fi
          KS="$RUNNER_TEMP/ompd-upload.jks"
          printf '%s' "$OMPD_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KS"
          chmod 600 "$KS"
          echo "OMPD_ANDROID_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          wc -c "$KS" | awk '{print "keystore_bytes",$1}'
      - name: Build release AAB
        run: bun run build:android:aab
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ompd-android-aab
          path: packages/app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Write Play service account
        if: env.OMPD_UPLOAD == 'true' && env.OMPD_PLAY_SERVICE_ACCOUNT_JSON_VALUE != ''
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          sa = Path(os.environ["RUNNER_TEMP"]) / "play-sa.json"
          sa.write_text(os.environ["OMPD_PLAY_SERVICE_ACCOUNT_JSON_VALUE"])
          sa.chmod(0o600)
          import json
          d = json.loads(sa.read_text())
          print("play_sa_client_email_set", bool(d.get("client_email")))
          print("play_sa_project_id_set", bool(d.get("project_id")))
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f"OMPD_PLAY_SERVICE_ACCOUNT_JSON={sa}\n")
          PY
      - name: Install Play upload deps
        if: env.OMPD_PLAY_SERVICE_ACCOUNT_JSON != ''
        run: pip install 'google-api-python-client>=2.100' 'google-auth>=2.23'
      - name: Require Play secrets when upload requested
        if: env.OMPD_UPLOAD == 'true' && env.OMPD_PLAY_SERVICE_ACCOUNT_JSON == ''
        run: |
          echo "::error::upload=true but OMPD_PLAY_SERVICE_ACCOUNT_JSON is missing. Set the secret or re-run with upload=false for artifact-only."
          exit 1
      - name: Upload to Play Internal testing
        if: env.OMPD_UPLOAD == 'true' && env.OMPD_PLAY_SERVICE_ACCOUNT_JSON != ''
        run: bun run upload:play-internal
      - name: Artifact-only notice
        if: env.OMPD_UPLOAD != 'true'
        run: echo "upload=false; AAB artifact retained (no Play submit)"

  macos-testflight:
    name: macOS archive
    needs: release-order
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (
        contains(github.event.inputs.platforms, 'macos') ||
        github.event.inputs.platforms == 'all'
      ))
    runs-on: macos-15
    timeout-minutes: 180
    defaults:
      run:
        working-directory: packages/app
    env:
      OMPD_APPLE_TEAM_ID: ${{ secrets.OMPD_APPLE_TEAM_ID }}
      OMPD_ASC_KEY_ID: ${{ secrets.OMPD_ASC_KEY_ID }}
      OMPD_ASC_ISSUER_ID: ${{ secrets.OMPD_ASC_ISSUER_ID }}
      OMPD_ASC_PRIVATE_KEY: ${{ secrets.OMPD_ASC_PRIVATE_KEY }}
      OMPD_APPLE_CERT_P12_BASE64: ${{ secrets.OMPD_APPLE_CERT_P12_BASE64 }}
      OMPD_APPLE_CERT_P12_PASSWORD: ${{ secrets.OMPD_APPLE_CERT_P12_PASSWORD }}
      OMPD_MACOS_PROFILE_BASE64: ${{ secrets.OMPD_MACOS_PROFILE_BASE64 }}
      OMPD_MACOS_INSTALLER_CERT_P12_BASE64: ${{ secrets.OMPD_MACOS_INSTALLER_CERT_P12_BASE64 }}
      OMPD_MACOS_INSTALLER_CERT_P12_PASSWORD: ${{ secrets.OMPD_MACOS_INSTALLER_CERT_P12_PASSWORD }}
      OMPD_APP_ID: ${{ vars.OMPD_ASC_APP_ID }}
      OMPD_BETA_GROUP_ID: ${{ vars.OMPD_ASC_BETA_GROUP_ID }}
      OMPD_UPLOAD: ${{ github.event_name == 'push' && 'true' || github.event.inputs.upload }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve build number
        run: |
          source ./scripts/lib/version.sh
          ompd_version__resolve
          {
            echo "OMPD_BUILD_NUMBER=$OMPD_BUILD_NUMBER"
            echo "OMPD_VERSION_CODE=$OMPD_BUILD_NUMBER"
            echo "OMPD_VERSION_NAME=$OMPD_VERSION_NAME"
            echo "OMPD_WINDOWS_VERSION=$OMPD_WINDOWS_VERSION"
          } >> "$GITHUB_ENV"
          echo "Resolved build number: $OMPD_BUILD_NUMBER (version $OMPD_VERSION_NAME)"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Require Apple team id
        if: env.OMPD_APPLE_TEAM_ID == ''
        run: |
          echo "::error::OMPD_APPLE_TEAM_ID secret is required"
          exit 1
      - name: Require distribution certificate
        if: env.OMPD_APPLE_CERT_P12_BASE64 == '' || env.OMPD_APPLE_CERT_P12_PASSWORD == ''
        run: |
          echo "::error::OMPD_APPLE_CERT_P12_BASE64 and OMPD_APPLE_CERT_P12_PASSWORD are required"
          exit 1
      - name: Require macOS signing material
        if: >
          env.OMPD_MACOS_PROFILE_BASE64 == '' ||
          env.OMPD_MACOS_INSTALLER_CERT_P12_BASE64 == '' ||
          env.OMPD_MACOS_INSTALLER_CERT_P12_PASSWORD == ''
        run: |
          echo "::error::macOS provisioning profile and installer certificate secrets are required"
          exit 1
      - name: Import ASC API key
        if: env.OMPD_ASC_KEY_ID != '' && env.OMPD_ASC_ISSUER_ID != '' && env.OMPD_ASC_PRIVATE_KEY != ''
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          key_id = os.environ["OMPD_ASC_KEY_ID"]
          material = os.environ["OMPD_ASC_PRIVATE_KEY"]
          if "\\n" in material and "\n" not in material:
              material = material.replace("\\n", "\n")
          p = Path.home() / ".appstoreconnect/private_keys" / f"AuthKey_{key_id}.p8"
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(material)
          p.chmod(0o600)
          print(f"asc_key_bytes {p.stat().st_size}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"OMPD_ASC_KEY_PATH={p}\n")
          PY
      - name: Import macOS provisioning profile
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          profile = Path(os.environ["RUNNER_TEMP"]) / "ompctl-macos.provisionprofile"
          profile.write_bytes(base64.b64decode("".join(os.environ["OMPD_MACOS_PROFILE_BASE64"].split())))
          profile.chmod(0o600)
          print(f"macos_profile_bytes {profile.stat().st_size}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"OMPD_MACOS_PROFILE_PATH={profile}\n")
          PY
      - name: Import Apple signing certificate
        run: bash ./scripts/import-apple-signing.sh
      - name: Select release Xcode
        run: bash ./scripts/select-release-xcode.sh
      - name: Install macOS pods
        run: cd macos && pod install
      - name: Archive macOS
        run: bun run build:macos:archive
      - name: Upload macOS export
        uses: actions/upload-artifact@v4
        with:
          name: ompd-macos-export
          path: packages/app/build/macos/export/**
          if-no-files-found: error
      - name: Require ASC release configuration (macOS)
        if: >
          env.OMPD_UPLOAD == 'true' && (
            env.OMPD_ASC_KEY_PATH == '' ||
            env.OMPD_APP_ID == '' ||
            env.OMPD_BETA_GROUP_ID == ''
          )
        run: |
          echo "::error::App Store Connect key, app id, and beta group id are required"
          exit 1
      - name: Check for an existing macOS upload
        id: macos_build
        if: env.OMPD_UPLOAD == 'true' && env.OMPD_ASC_KEY_PATH != ''
        run: |
          if bun scripts/asc.ts find-build "$OMPD_BUILD_NUMBER" MAC_OS; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" -ne 3 ]]; then
              exit "$status"
            fi
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload macOS to App Store Connect / TestFlight
        if: env.OMPD_UPLOAD == 'true' && env.OMPD_ASC_KEY_PATH != '' && steps.macos_build.outputs.exists != 'true'
        run: |
          PKG="$(find build/macos/export -name '*.pkg' -print -quit)"
          if [[ -z "$PKG" || ! -f "$PKG" ]]; then
            echo "::error::No signed macOS pkg export found to upload"
            exit 1
          fi
          export API_PRIVATE_KEYS_DIR
          API_PRIVATE_KEYS_DIR="$(cd "$(dirname "$OMPD_ASC_KEY_PATH")" && pwd)"
          xcrun altool --upload-app             --type macos             --file "$PKG"             --apiKey "$OMPD_ASC_KEY_ID"             --apiIssuer "$OMPD_ASC_ISSUER_ID"
          echo "uploaded macOS build to App Store Connect"
      - name: Publish macOS build to internal testers
        if: env.OMPD_UPLOAD == 'true' && env.OMPD_ASC_KEY_PATH != ''
        run: bun scripts/asc.ts wait-assign "$OMPD_BUILD_NUMBER" MAC_OS
      - name: Artifact-only notice (macOS)
        if: env.OMPD_UPLOAD != 'true'
        run: echo "upload=false; macOS export artifact retained (no ASC submit)"

  windows-msix:
    name: Windows MSIX package
    if: >
      github.event_name == 'workflow_dispatch' && (
        contains(github.event.inputs.platforms, 'windows') ||
        github.event.inputs.platforms == 'all'
      )
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: packages/app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve build number
        shell: bash
        run: |
          source ./scripts/lib/version.sh
          ompd_version__resolve
          {
            echo "OMPD_BUILD_NUMBER=$OMPD_BUILD_NUMBER"
            echo "OMPD_VERSION_CODE=$OMPD_BUILD_NUMBER"
            echo "OMPD_VERSION_NAME=$OMPD_VERSION_NAME"
            echo "OMPD_WINDOWS_VERSION=$OMPD_WINDOWS_VERSION"
          } >> "$GITHUB_ENV"
          echo "Resolved build number: $OMPD_BUILD_NUMBER (version $OMPD_VERSION_NAME)"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Locate MSBuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild not found" }
          "MSBUILD_PATH=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "msbuild=$msbuild"
      - name: Build MSIX
        shell: bash
        run: bun run build:windows:msix
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ompd-windows-msix
          path: |
            packages/app/windows/**/AppPackages/**/*.msix
            packages/app/windows/**/AppPackages/**/*.msixbundle
            packages/app/windows/**/AppPackages/**/*.appx
          if-no-files-found: warn
