name: App store release tracks

# APP STORE PUBLICATION PERMANENTLY DISABLED
# Release tracks and automated upload capabilities are retired.

on:
  workflow_dispatch:

jobs:
  refusal:
    name: Refuse retired distribution
    runs-on: ubuntu-latest
    steps:
      - name: Refuse app store publication
        run: |
          echo "::error::App store distribution is retired. Automated release tracks and store uploads are disabled."
          exit 1
