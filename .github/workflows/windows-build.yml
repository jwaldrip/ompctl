name: Windows desktop build

on:
  pull_request:
    paths:
      - "packages/app/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/windows-build.yml"
  push:
    branches:
      - main
    paths:
      - "packages/app/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build React Native Windows app
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3"
      # react-native-windows' Microsoft.ReactNative.Managed targets net6.0.
      # The runner image now ships only the .NET 10 SDK, and NuGet resolves the
      # managed project against it, where WindowsAppSDK 1.8 refuses: "requires
      # .NET 6.0, update your TargetFramework". Installing the SDK the project
      # actually targets restores resolution; this failed every run on main
      # since the image drifted, independent of any change in this repo.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify generated Windows native autolinks
        shell: pwsh
        working-directory: packages/app
        run: |
          npx --yes @react-native-community/cli autolink-windows --sln windows/ompd.sln --proj windows/ompd/ompd.vcxproj
          git diff --exit-code -- windows/ompd/AutolinkedNativeModules.g.cpp windows/ompd/AutolinkedNativeModules.g.h windows/ompd/AutolinkedNativeModules.g.props windows/ompd/AutolinkedNativeModules.g.targets
      - name: Generate Windows native spec code
        shell: pwsh
        working-directory: packages/app
        run: |
          npx --yes @react-native-community/cli codegen-windows
      - name: Build generated Windows solution
        shell: pwsh
        working-directory: packages/app/windows
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) {
            throw "MSBuild is not installed on this runner."
          }
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\Include"
          $sdkVersion = Get-ChildItem $sdkRoot -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName "um\Windows.h") } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1 -ExpandProperty Name
          if (-not $sdkVersion) {
            throw "No Windows SDK with Windows.h is installed on this runner."
          }
          # NuGet floated Microsoft.WindowsAppSDK to 1.8.251216001, whose
          # targets refuse this repo's old-style csproj ("requires .NET 6.0").
          # react-native-windows' own PropertySheets/WinUI.props declare
          # 1.8.260508005, the version its CI builds against, so build that
          # one instead of letting restore guess.
          & $msbuild ompd.sln /m /restore /p:Configuration=Debug /p:Platform=x64 "/p:WindowsTargetPlatformVersion=$sdkVersion" /p:PlatformToolset=v145 /p:WindowsAppSDKVerifyTransitiveDependencies=false /p:RunCodegenWindows=false "/p:WinUI3Version=1.8.260508005"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
