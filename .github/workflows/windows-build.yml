name: Windows desktop build

on:
  pull_request:
    paths:
      - "packages/app/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/windows-build.yml"
  push:
    branches:
      - main
    paths:
      - "packages/app/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build React Native Windows app
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify generated Windows native autolinks
        shell: pwsh
        working-directory: packages/app
        run: |
          npx --yes @react-native-community/cli autolink-windows --sln windows/ompd.sln --proj windows/ompd/ompd.vcxproj
          git diff --exit-code -- windows/ompd/AutolinkedNativeModules.g.cpp windows/ompd/AutolinkedNativeModules.g.h windows/ompd/AutolinkedNativeModules.g.props windows/ompd/AutolinkedNativeModules.g.targets
      - name: Generate Windows native spec code
        shell: pwsh
        working-directory: packages/app
        run: |
          npx --yes @react-native-community/cli codegen-windows
      - name: Build generated Windows solution
        shell: pwsh
        working-directory: packages/app/windows
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) {
            throw "MSBuild is not installed on this runner."
          }
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\Include"
          $sdkVersion = Get-ChildItem $sdkRoot -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName "um\Windows.h") } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1 -ExpandProperty Name
          if (-not $sdkVersion) {
            throw "No Windows SDK with Windows.h is installed on this runner."
          }
          # Build the app's vcxproj with the solution named for it, so the
          # autolinked native closure (async-storage, clipboard, svg) resolves
          # exactly as it does from ompd.sln, while the MSIX packaging project
          # stays with `scripts/windows-msix.sh`, which builds the solution's
          # ompd_Package target unsigned on purpose. Two community modules are
          # excluded from Windows autolinking in react-native.config.cjs and
          # the notes there say why: react-native-view-shot's UWP C# module
          # was what kept dragging Microsoft.ReactNative.Managed into every
          # build here (red on WindowsAppSDK 1.8's .NET check and its UWP
          # XAML type forwarders), and react-native-webview 15's Fabric
          # component needs react-native-windows 0.82, which the 0.81 line
          # this app shares across platforms cannot provide. The autolink
          # verification step above is what proves the generated files still
          # say so.
          & $msbuild ompd\ompd.vcxproj /m /restore "/p:SolutionDir=$PWD\" "/p:SolutionPath=$PWD\ompd.sln" /p:SolutionFileName=ompd.sln /p:Configuration=Debug /p:Platform=x64 "/p:WindowsTargetPlatformVersion=$sdkVersion" /p:PlatformToolset=v145 /p:WindowsAppSDKVerifyTransitiveDependencies=false /p:RunCodegenWindows=false
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Verify deployed font assets in build output
        shell: pwsh
        working-directory: packages/app/windows
        run: |
          $fontDir = "x64\Debug\Assets\Fonts"
          if (-not (Test-Path $fontDir)) {
            throw "Deployed font directory '$fontDir' not found in build output."
          }
          Write-Host "Listing deployed fonts in ${fontDir}:"
          $fonts = Get-ChildItem -Path $fontDir -File
          $fonts | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }
          $expected = @(
            "Archivo-Regular.ttf",
            "Archivo-Medium.ttf",
            "Archivo-SemiBold.ttf",
            "IBMPlexMono-Regular.ttf",
            "IBMPlexMono-Medium.ttf",
            "SymbolsNF.ttf"
          )
          $missing = @()
          foreach ($f in $expected) {
            if (-not (Test-Path (Join-Path $fontDir $f))) {
              $missing += $f
            }
          }
          if ($missing.Count -gt 0) {
            throw "Missing expected deployed font(s): $($missing -join ', ')"
          }
          Write-Host "All six font faces successfully verified in build output."
      - name: Launch app and capture screenshot
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/feat/nf-windows-fonts'
        shell: pwsh
        working-directory: packages/app
        run: |
          $screenshotDir = "windows\screenshots"
          New-Item -ItemType Directory -Force -Path $screenshotDir | Out-Null
          $screenshotPath = Join-Path $screenshotDir "pair-screen.png"

          Write-Host "Starting Metro bundler on port 8081..."
          $metro = Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "npx react-native start --port 8081" -PassThru
          Write-Host "Metro process PID: $($metro.Id)"

          $deadline = [DateTime]::UtcNow.AddSeconds(60)
          $metroUp = $false
          while ([DateTime]::UtcNow -lt $deadline) {
            try {
              $res = Invoke-WebRequest -Uri "http://localhost:8081/status" -UseBasicParsing -TimeoutSec 2 -ErrorAction Stop
              if ($res.StatusCode -eq 200) {
                $metroUp = $true
                Write-Host "Metro is ready on port 8081."
                break
              }
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          if (-not $metroUp) {
            Write-Warning "Metro did not answer on port 8081 within 60s, proceeding with app launch attempt."
          }

          $appExe = Resolve-Path "windows\x64\Debug\ompd.exe"
          Write-Host "Launching app from $appExe..."
          $app = $null
          try {
            $app = Start-Process -FilePath $appExe -PassThru
            Write-Host "App process PID: $($app.Id)"
          } catch {
            Write-Warning "Failed to launch app executable: $_"
          }

          Write-Host "Waiting 30 seconds for initial render..."
          Start-Sleep -Seconds 30

          if ($app -and $app.HasExited) {
            Write-Warning "App exited prematurely with exit code: $($app.ExitCode)"
          }

          try {
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            Write-Host "Primary screen bounds: $($bounds.Width) x $($bounds.Height)"
            $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bmp.Save($screenshotPath, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose()
            $bmp.Dispose()
            Write-Host "Screenshot successfully saved to $screenshotPath"
          } catch {
            Write-Warning "Screenshot capture failed: $_"
          }

          if ($app -and -not $app.HasExited) {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }
          if ($metro -and -not $metro.HasExited) {
            Stop-Process -Id $metro.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: windows-pair-screen-screenshot
          path: packages/app/windows/screenshots/*.png
          if-no-files-found: ignore
