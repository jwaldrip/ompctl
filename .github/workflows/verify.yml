name: Verify

# Deliberately unfiltered. Every other workflow here is scoped to
# `packages/app/**`, which left most of the repository with no pull-request
# coverage at all: a change confined to `packages/core`, `daemon`, `hub`,
# `tunnel`, `cli`, `web`, or `e2e` triggered nothing, so "merge on green" had
# nothing to observe. The root `check` and `test` scripts already cover every
# workspace; they just were not being run.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck + tests
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    # The hub's redis-backed backplane is the part that can only work or fail
    # for real against a real redis, so its tests are skipped rather than run
    # against the memory implementation when none is named. `hub-deploy.yml`
    # provides one, but that workflow is `workflow_dispatch` only, so nothing
    # automatic has ever run them: a relay that stopped routing while still
    # answering `linked` was invisible to every check in this repository. It is
    # here, on every pull request, for the same reason the rest of this workflow
    # is deliberately unfiltered.
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      # Full history: the provenance sweep walks every ref, and the default
      # depth-1 checkout would leave it auditing a single commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # Frozen on purpose: a lockfile that disagrees with the manifests is the
      # failure this repository has already shipped once, when a dependency was
      # edited by hand and the lockfile was left behind.
      - run: bun install --frozen-lockfile
      - name: Typecheck and lint every workspace
        run: bun run check
      - name: Unit and integration tests
        env:
          OMPD_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: bun run test
      # Guards the scrubbed history. Runs on every PR because a single careless
      # paste into any file would reintroduce what a history rewrite removed, and
      # the published repo is public.
      - name: Provenance sweep
        # The term list is a roster of family, client, and vendor names, so it
        # cannot live in this public repo; it arrives as a secret, and the script
        # exits 2 rather than sweeping for an empty pattern if it is absent.
        #
        # GitHub withholds secrets from fork pull requests, so this is scoped to
        # runs that can hold one. That is an explicit condition rather than a
        # missing-secret skip: a guard that quietly passes when its input vanishes
        # is worse than one that is plainly out of scope, and the push-to-main run
        # is what protects published history either way.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          OMPCTL_PROVENANCE_TERMS: ${{ secrets.OMPCTL_PROVENANCE_TERMS }}
        run: bun run check:provenance

# `check:mcp` is deliberately NOT run here, and that is a gap rather than a
# preference.
#
# It is the only check in this repository that drives the compiled artifact:
# `bun build --compile` dropping a dependency, the seven-tool MCP surface
# changing, and a stray stdout write corrupting the stdio framing are all
# invisible to everything above, because everything above runs from source under
# `bun` where a native addon resolves out of `node_modules` normally.
#
# It was added here and removed again, on evidence. The compiled `ompd` cannot
# start a daemon in a fresh CI checkout on either runner: it dies at startup with
# "Failed to load pi_natives native addon", for `linux-x64` on ubuntu and for
# `darwin-arm64` on macos-15. So a single-file executable produced by `--compile`
# cannot load that addon in CI, on the platform this artifact actually ships to
# or on the cheaper one. The lockfile is not the cause: the `pi-natives` entries
# are identical to main's, and the from-source job installs and uses the same
# addon successfully in the same checkout.
#
# Wiring it anyway would leave a gate that is red on every pull request forever,
# which trains people to ignore a red check. So it stays a local check, run
# against a real compiled binary before a release, and this comment is the record
# of why CI does not carry it. Closing it means making `--compile` carry the
# addon, or teaching the binary to find it; neither is this branch's to do.
