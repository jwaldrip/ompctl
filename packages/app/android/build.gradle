buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

/**
 * Detox does not publish its Android artifact to any public Maven repository:
 * `com.wix:detox` ships as a small local repo inside the npm package. Without
 * this, resolution falls through to the configured remotes and fails with a
 * parse error on a JitPack HTML 404 page rather than a missing-artifact message.
 *
 * The location is resolved by asking Node where the package is, rather than by
 * walking a fixed number of `..` segments up to `node_modules`. A hardcoded
 * depth is only correct for one directory layout: the same assumption in
 * `packages/app/vite.config.ts` broke the web target outright when this tree was
 * extracted one level shallower. This form also survives a package manager
 * hoisting `detox` somewhere other than the workspace root.
 */
allprojects {
    repositories {
        maven {
            url "${providers.exec {
                commandLine "node", "--print",
                    "require('path').dirname(require.resolve('detox/package.json'))"
            }.standardOutput.asText.get().trim()}/Detox-android"
        }
    }
}
