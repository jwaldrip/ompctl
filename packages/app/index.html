<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0c10" />
    <title>ompd</title>
    <style>
      /*
       * The same binaries the native targets link, declared for the browser.
       * One source of truth for the typefaces means the web build cannot drift
       * onto a system face while the Mac app is showing Archivo.
       */
      @font-face {
        font-family: "Archivo-Regular";
        src: url("/src/design/fonts/Archivo-Regular.ttf") format("truetype");
        font-display: swap;
      }
      @font-face {
        font-family: "Archivo-Medium";
        src: url("/src/design/fonts/Archivo-Medium.ttf") format("truetype");
        font-display: swap;
      }
      @font-face {
        font-family: "Archivo-SemiBold";
        src: url("/src/design/fonts/Archivo-SemiBold.ttf") format("truetype");
        font-display: swap;
      }
      @font-face {
        font-family: "IBMPlexMono-Regular";
        src: url("/src/design/fonts/IBMPlexMono-Regular.ttf") format("truetype");
        font-display: swap;
      }
      @font-face {
        font-family: "IBMPlexMono-Medium";
        src: url("/src/design/fonts/IBMPlexMono-Medium.ttf") format("truetype");
        font-display: swap;
      }

      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #0a0c10;
      }
      /* react-native-web measures against the root; without this the app is 0px tall. */
      #root {
        display: flex;
      }

      /*
       * Scrollbars are part of the interface, drawn in its own materials.
       *
       * The browser default is a 15px light-grey classic bar on a dark panel,
       * sitting in a gutter of its own, and it read as a foreign object beside
       * every list. The values are `ground.edge` for the thumb, `ink.faint`
       * under the pointer, and no track at all, so the bar runs to the very
       * edge of whatever scrolls (`tokens.ts` is the source; this file cannot
       * import it). `scrollbar-width` and `scrollbar-color` are the standard
       * properties and cover Firefox and current Chromium; the `::-webkit-`
       * rules reach the Chromium and WebKit builds that still ignore them.
       */
      * {
        scrollbar-width: thin;
        scrollbar-color: #262d38 transparent;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #262d38;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #7a8595;
      }
      ::-webkit-scrollbar-corner {
        background: transparent;
      }

      /*
       * Hover is a pointer asking "does this respond?", and the answer has
       * to arrive before the click. React Native has no hover state, so the
       * app's pressables paint their `ground.active` only while held, and on
       * a desktop every session row and button sat inert under the mouse
       * until it was already pressed. This lays a translucent wash over any
       * pressable the pointer rests on. It is an overlay rather than a
       * background so it composes with whatever the control already paints
       * (a row, an azure button, a chip) instead of replacing it, and it
       * follows the control's own corners. Only a hovering pointer gets it:
       * a touch screen has no hover, and a finger must not leave a wash
       * behind on the row it just tapped.
       */
      @media (hover: hover) and (pointer: fine) {
        [role="button"]:not([aria-disabled="true"]):hover::after,
        [role="switch"]:not([aria-disabled="true"]):hover::after,
        [role="checkbox"]:not([aria-disabled="true"]):hover::after,
        [role="radio"]:not([aria-disabled="true"]):hover::after {
          content: "";
          position: absolute;
          inset: 0;
          border-radius: inherit;
          background: rgba(255, 255, 255, 0.05);
          pointer-events: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.web.tsx"></script>
  </body>
</html>
